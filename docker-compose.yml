# Production — this file is uploaded to the server on every deploy.
# Secrets (DATABASE_URL, etc.) live in .env on the server, not in the repo.
services:
  app:
    image: ${IMAGE:-ghcr.io/your-org/your-service:latest}
    restart: unless-stopped
    # host networking lets the container reach Postgres on localhost:5432
    # (Postgres runs as a standalone container bound to 127.0.0.1)
    network_mode: host
    env_file:
      - .env
    healthcheck:
      # $$ escapes $ from Docker Compose interpolation so the shell inside the container evaluates it.
      # PORT extracts the port from HTTP_ADDR (e.g. ":8080" → "8080"), defaulting to 8080.
      test: ["CMD", "sh", "-c", "PORT=$${HTTP_ADDR##*:}; wget -qO- http://localhost:$${PORT:-8080}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
