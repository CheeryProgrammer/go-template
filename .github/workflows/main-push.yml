# Triggered on every push to main (auto-deploy to staging)
# or manually via workflow_dispatch to deploy any branch to staging.
name: Main — CI + Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_ci:
        description: 'Skip CI and deploy immediately (use only if CI already passed)'
        type: boolean
        default: false

concurrency:
  group: staging-deploy
  cancel-in-progress: false   # never cancel a deploy mid-flight

jobs:
  ci:
    name: CI
    if: ${{ !inputs.skip_ci }}
    uses: CheeryProgrammer/goship/.github/workflows/ci-pipeline.yml@main
    with:
      go-version: '1.26'
      golangci-lint-version: 'v2.10.1'
      binary-name: myapp
      main-package: './cmd/server'
      run-integration-tests: true
      postgres-enabled: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      INTEGRATION_ENV: ${{ secrets.INTEGRATION_ENV }}

  deploy-staging:
    name: Deploy → Staging
    needs: [ci]
    if: |
      always() &&
      (needs.ci.result == 'success' || needs.ci.result == 'skipped') &&
      (vars.STAGING_DEPLOY_ENABLED == 'true' || github.event_name == 'workflow_dispatch')
    uses: CheeryProgrammer/goship/.github/workflows/cd-pipeline.yml@main
    with:
      environment: staging
      image-name: ghcr.io/${{ github.repository }}
      dockerfile: Dockerfile
      platforms: linux/amd64
      run-migrations: true
      ssh-host: ${{ vars.STAGING_SSH_HOST }}
      ssh-user: ${{ vars.STAGING_SSH_USER }}
      compose-file-local: docker-compose.yml
      compose-file-remote: ~/app/docker-compose.yml
      service-name: app
      ssh-known-hosts: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
    secrets:
      REGISTRY_USERNAME: ${{ github.actor }}
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
