# ────────────────────────────────────────────────────────────────────────────
# Triggered on every pull request to main.
# Replace "CheeryProgrammer/goship" with your actual org/repo name.
# ────────────────────────────────────────────────────────────────────────────
name: PR Checks

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]

# Cancel in-flight runs for the same PR
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: CheeryProgrammer/goship/.github/workflows/ci-pipeline.yml@main
    with:
      go-version: '1.26'
      golangci-lint-version: 'v2.10.1'
      binary-name: myapp
      main-package: './cmd/server'
      test-packages: './...'
      # Template ships with no tests — set to 0 so the threshold never blocks a fresh project.
      # Raise this once you have real test coverage.
      coverage-threshold: 0
      # Set to true and add CODECOV_TOKEN secret to enable coverage uploads.
      upload-coverage: false
      run-integration-tests: true
      integration-test-packages: './tests/integration/...'
      integration-test-tags: integration
      postgres-enabled: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      INTEGRATION_ENV: ${{ secrets.INTEGRATION_ENV }}
